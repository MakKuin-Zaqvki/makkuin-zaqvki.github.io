<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заявки — Маккуин</title>
 <link rel="icon" type="image/png" href="https://otchet-makkuin-disney.github.io/zaplati/logo-makkuin.png">
   <link rel="apple-touch-icon" href="https://otchet-makkuin-disney.github.io/logo-makkuin.png">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Roboto', Arial, sans-serif;
        background: linear-gradient(135deg, #ede7f6 0%, #f3e5f5 100%);
        min-height: 100vh;
        padding: 12px;
        color: #333;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .header {
        background: linear-gradient(135deg, #7e57c2, #512da8);
        color: #fff;
        border-radius: 12px;
        padding: 18px;
        text-align: center;
        margin-bottom: 16px;
        box-shadow: 0 4px 16px rgba(103,58,183,0.25);
    }
    .header h1 { font-size: 20px; margin-bottom: 4px; }
    .header .sub { font-size: 12px; opacity: 0.85; }

    .panel {
        background: rgba(255,255,255,0.97);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
        box-shadow: 0 4px 14px rgba(103,58,183,0.12);
    }
    .panel h2 {
        font-size: 14px; color: #673ab7; text-transform: uppercase;
        letter-spacing: 0.5px; margin-bottom: 12px;
    }
    .range-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
    .range-field { display: flex; flex-direction: column; gap: 4px; }
    .range-field label { font-size: 11px; color: #777; font-weight: bold; }
    .range-field input[type="date"] {
        padding: 9px 10px; border: 1.5px solid #ddd; border-radius: 8px;
        font-size: 14px; font-family: inherit;
    }
    .btn {
        background: linear-gradient(135deg, #7e57c2, #512da8);
        color: #fff; border: none; border-radius: 8px;
        padding: 10px 20px; font-size: 14px; font-weight: bold;
        cursor: pointer; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.secondary { background: linear-gradient(135deg, #66bb6a, #2e7d32); }
    .btn.small { padding: 6px 12px; font-size: 12px; }

    .status-msg { font-size: 12px; color: #777; margin-top: 8px; }
    .status-msg.error { color: #c62828; }
    .status-msg.ok { color: #2e7d32; }

    .summary-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chip {
        background: #ede7f6; color: #512da8; border-radius: 20px;
        padding: 5px 12px; font-size: 11.5px; font-weight: bold;
    }
    .chip.empty { background: #f5f5f5; color: #aaa; font-weight: normal; }

    .resv-list { margin-top: 10px; font-size: 11.5px; color: #666; max-height: 160px; overflow-y: auto; }
    .resv-list div { padding: 3px 0; border-bottom: 1px solid #f0f0f0; }

    .supplier-group { margin-bottom: 14px; }
    .supplier-title {
        background: #673ab7; color: #fff; padding: 8px 12px;
        border-radius: 8px 8px 0 0; font-size: 12.5px; font-weight: bold;
        text-transform: uppercase; letter-spacing: 0.5px;
    }
    table.prod-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.prod-table th {
        background: #f5f2fb; color: #673ab7; padding: 7px 8px; text-align: left;
        font-size: 10.5px; text-transform: uppercase;
    }
    table.prod-table td { padding: 6px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    table.prod-table tr:last-child td { border-bottom: none; }
    table.prod-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
    table.prod-table td.need { font-weight: bold; color: #1565c0; }
    table.prod-table td.order-cell { font-weight: bold; }
    table.prod-table td.order-cell.pos { color: #d84315; }
    table.prod-table td.order-cell.zero { color: #aaa; font-weight: normal; }
    table.prod-table input.stock-input {
        width: 62px; padding: 5px 6px; border: 1.5px solid #ddd; border-radius: 6px;
        font-size: 12px; text-align: right; font-family: inherit;
    }
    table.prod-table input.stock-input:focus { border-color: #7e57c2; outline: none; }
    .sign-toggle-btn {
        width: 22px; height: 22px; margin-left: 4px; border: 1.5px solid #ddd; border-radius: 6px;
        background: #fff; color: #673ab7; font-weight: bold; cursor: pointer; font-size: 13px; line-height: 1;
    }
    .sign-toggle-btn:hover { background: #f5f2fb; }

    .save-bar {
        position: sticky; bottom: 10px; display: flex; justify-content: center;
        margin-top: 16px;
    }
    .save-bar .btn { box-shadow: 0 4px 14px rgba(0,0,0,0.2); }

    .empty-note { text-align: center; color: #999; font-size: 13px; padding: 30px 10px; }
    .loading-note { text-align: center; color: #7e57c2; font-size: 13px; padding: 20px; }

    .stats-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .stats-table th { background: #f5f2fb; color: #673ab7; padding: 7px 10px; text-align: left; font-size: 10.5px; text-transform: uppercase; }
    .stats-table td { padding: 6px 10px; border-bottom: 1px solid #f0f0f0; }
    .stats-table td.num { text-align: right; font-weight: bold; color: #2e7d32; }
    .stats-table tr.current-month { background: #f5f2fb; }
    .stats-table tr.current-month td { font-weight: bold; color: #512da8; }
    .stats-total-row td { border-top: 2px solid #673ab7; font-weight: bold; }

    a.back-link { display: inline-block; margin-bottom: 10px; color: #673ab7; font-size: 12px; text-decoration: none; font-weight: bold; }

    .month-records { margin: 6px 0 14px 0; }
    .month-record-row {
        display: flex; justify-content: space-between; align-items: center;
        padding: 7px 10px; margin-bottom: 5px; background: #faf9fd;
        border: 1.5px solid #ede7f6; border-radius: 8px; font-size: 11.5px;
        color: #555; cursor: pointer; transition: background 0.15s, border-color 0.15s;
    }
    .month-record-row:hover { background: #ede7f6; border-color: #b39ddb; }
    .month-record-row .rec-period { color: #666; }
    .month-record-row .rec-total { font-weight: bold; color: #2e7d32; }

    .record-modal-overlay {
        display: none; position: fixed; inset: 0; background: rgba(30,20,50,0.45);
        z-index: 1000; align-items: center; justify-content: center; padding: 14px;
    }
    .record-modal-overlay.open { display: flex; }
    .record-modal {
        background: #fff; border-radius: 14px; width: 100%; max-width: 760px;
        max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .record-modal-header {
        background: linear-gradient(135deg, #7e57c2, #512da8); color: #fff;
        padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;
        font-weight: bold; font-size: 14px;
    }
    .record-modal-close { background: none; border: none; color: #fff; font-size: 16px; cursor: pointer; }
    .record-modal-body { padding: 12px 16px; overflow-y: auto; flex: 1; }
    .rin-group { margin-bottom: 4px; }
    .rin-group-header {
        font-size: 11px; font-weight: bold; color: #7e57c2; text-transform: uppercase;
        letter-spacing: 0.3px; margin: 12px 0 4px; padding-bottom: 4px;
        border-bottom: 1.5px solid #ede7f6;
    }
    .rin-group:first-child .rin-group-header { margin-top: 0; }
    .rin-name-wrap { position: relative; }
    .rin-autocomplete {
        position: absolute; top: 100%; left: 0; right: 0; z-index: 20;
        background: #fff; border: 1.5px solid #b39ddb; border-radius: 8px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.18); max-height: 190px; overflow-y: auto;
        margin-top: 3px;
    }
    .rin-autocomplete-item { padding: 7px 10px; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
    .rin-autocomplete-item:hover, .rin-autocomplete-item.active { background: #ede7f6; }
    .rin-autocomplete-item .aci-name { color: #333; }
    .rin-autocomplete-item .aci-meta { color: #888; font-size: 10.5px; white-space: nowrap; }
    .record-item-row {
        display: flex; align-items: center; gap: 14px; flex-wrap: nowrap;
        padding: 9px 0; border-bottom: 1px solid #f0f0f0; font-size: 12.5px;
    }
    .record-item-row .rin-name-wrap { flex: 1; min-width: 0; }
    .record-item-row .rin-name { color: #333; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .record-item-row .rin-meta { color: #888; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .record-item-row .rin-fields { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .record-item-row .rin-qty-wrap, .record-item-row .rin-cost-wrap { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .record-item-row .rin-qty-wrap label, .record-item-row .rin-cost-wrap label { font-size: 11px; color: #777; }
    .record-item-row input.rin-qty, .record-item-row input.rin-need { width: 58px; padding: 6px 7px; border: 1.5px solid #ddd; border-radius: 6px; font-size: 12.5px; text-align: right; font-family: inherit; }
    .record-item-row input.rin-qty:focus, .record-item-row input.rin-need:focus { border-color: #7e57c2; outline: none; }
    .record-item-row .rin-qty-unit { font-size: 11px; color: #777; }
    .record-item-row input.rin-cost {
        width: 85px; padding: 6px 7px; border: 1.5px solid #ddd; border-radius: 6px;
        font-size: 12.5px; text-align: right; font-family: inherit;
    }
    .record-item-row input.rin-cost:focus { border-color: #7e57c2; outline: none; }
    .record-item-row input.rin-name-input {
        width: 100%; border: none; background: transparent; font-weight: bold; color: #333;
        font-size: 12.5px; padding: 3px 0; font-family: inherit;
    }
    .record-item-row input.rin-name-input:focus { outline: none; border-bottom: 1.5px solid #7e57c2; }
    .record-item-row .rin-remove {
        background: none; border: none; color: #bbb; font-size: 14px; cursor: pointer;
        padding: 2px 4px; line-height: 1;
    }
    .record-item-row .rin-remove:hover { color: #c62828; }
    @media (max-width: 640px) {
        .record-item-row { flex-wrap: wrap; }
        .record-item-row .rin-name-wrap { flex-basis: 100%; }
        .record-item-row .rin-fields { flex-basis: 100%; justify-content: space-between; }
    }
    .record-modal-footer {
        padding: 12px 16px; border-top: 1.5px solid #f0f0f0; display: flex;
        flex-direction: column; gap: 10px;
    }
    .record-modal-total-row { display: flex; justify-content: space-between; align-items: center; }
    .record-modal-total { font-size: 13.5px; font-weight: bold; color: #512da8; display: flex; align-items: center; gap: 6px; }
    .record-modal-total input {
        width: 100px; padding: 6px 8px; border: 1.5px solid #b39ddb; border-radius: 6px;
        font-size: 13.5px; font-weight: bold; text-align: right; color: #512da8; font-family: inherit;
    }
    .record-modal-actions { display: flex; justify-content: space-between; gap: 10px; }
    .btn.danger { background: linear-gradient(135deg, #ef5350, #c62828); }
    .record-modal-status-wrap { padding: 0 16px 10px; }

    .settings-panel { display: none; }
    .settings-panel.open { display: block; }
    .settings-row {
        display: grid; grid-template-columns: 1fr 100px 60px 75px 75px; gap: 6px; align-items: center;
        padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 11.5px;
    }
    .settings-row .sname { color: #444; }
    .settings-row input, .settings-row select {
        padding: 6px 5px; border: 1.5px solid #ddd; border-radius: 6px; font-size: 11.5px;
        font-family: inherit; text-align: right; width: 100%;
    }
    .settings-row select { text-align: left; }
    .settings-row input:focus, .settings-row select:focus { border-color: #7e57c2; outline: none; }
    .settings-supplier-title {
        background: #ede7f6; color: #512da8; padding: 6px 10px; border-radius: 6px;
        font-size: 11.5px; font-weight: bold; text-transform: uppercase; margin: 12px 0 4px 0;
    }
    .settings-hdr { display:grid; grid-template-columns: 1fr 100px 60px 75px 75px; gap:6px; font-size:9.5px; color:#999; font-weight:bold; text-transform:uppercase; padding: 4px 0; }

    .add-article-box {
        background: #f5f2fb; border: 1.5px dashed #b39ddb; border-radius: 10px;
        padding: 12px; margin-bottom: 16px;
    }
    .add-article-box h3 { font-size: 12px; color: #512da8; margin-bottom: 10px; }
    .add-article-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;
    }
    .add-article-grid.full { grid-template-columns: 1fr; }
    .add-article-box label { font-size: 10px; color: #777; font-weight: bold; display:block; margin-bottom: 2px; }
    .add-article-box input, .add-article-box select {
        width: 100%; padding: 8px; border: 1.5px solid #ddd; border-radius: 7px; font-size: 12.5px; font-family: inherit;
    }

    .price-col { color: #2e7d32; font-weight: bold; }
    .supplier-subtotal {
        display: flex; justify-content: space-between; padding: 8px 12px;
        background: #f5f2fb; border-radius: 0 0 8px 8px; font-size: 12.5px; font-weight: bold; color: #512da8;
    }
    .grand-total {
        margin-top: 6px; padding: 14px 18px; border-radius: 12px;
        background: linear-gradient(135deg, #66bb6a, #2e7d32); color: #fff;
        display: flex; justify-content: space-between; align-items: center;
        font-size: 16px; font-weight: bold; box-shadow: 0 4px 14px rgba(46,125,50,0.25);
    }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📦 Заявки за поръчка</h1>
        <div class="sub">Автоматично изчислени продукти на база резервации</div>
    </div>

    <div class="panel">
        <h2>Период</h2>
        <div class="range-row">
            <div class="range-field">
                <label>От дата</label>
                <input type="date" id="rangeStart">
            </div>
            <div class="range-field">
                <label>До дата</label>
                <input type="date" id="rangeEnd">
            </div>
            <button class="btn" id="loadBtn">Зареди резервации</button>
            <button class="btn small" id="toggleSettingsBtn" style="background:linear-gradient(135deg,#78909c,#455a64);">⚙️ Настройки опаковки/цени</button>
        </div>
        <div class="status-msg" id="loadStatus"></div>
        <div class="summary-chips" id="summaryChips"></div>
        <div class="resv-list" id="resvList"></div>
    </div>

    <div class="panel settings-panel" id="settingsPanel">
        <h2>Настройки: опаковка, мярка и цена на артикул</h2>
        <div class="status-msg" id="settingsStatus"></div>

        <div class="add-article-box">
            <h3>➕ Добави нов артикул</h3>
            <div class="add-article-grid">
                <div>
                    <label>Име на артикула</label>
                    <input type="text" id="newArtName" placeholder="напр. Кетчуп">
                </div>
                <div>
                    <label>Мярка</label>
                    <select id="newArtUnit">
                        <option value="бр">бр.</option>
                        <option value="кг">кг</option>
                        <option value="г">г</option>
                        <option value="л">л</option>
                        <option value="мл">мл</option>
                    </select>
                </div>
            </div>
            <div class="add-article-grid">
                <div>
                    <label>Категория</label>
                    <select id="newArtCategory">
                        <option value="__new__">+ Нова категория...</option>
                    </select>
                </div>
                <div id="newArtCategoryNewWrap" style="display:none;">
                    <label>Име на новата категория</label>
                    <input type="text" id="newArtCategoryNew" placeholder="напр. БАР">
                </div>
            </div>
            <div class="add-article-grid">
                <div>
                    <label>Опаковка (по избор)</label>
                    <input type="text" inputmode="decimal" id="newArtPack" placeholder="напр. 2.5">
                </div>
                <div>
                    <label>Цена на опаковка</label>
                    <input type="text" inputmode="decimal" id="newArtPrice" placeholder="напр. 5.20">
                </div>
            </div>
            <div style="text-align:right; margin-top:6px;">
                <button class="btn small" id="addArticleBtn">Добави артикул</button>
            </div>
        </div>

        <div id="settingsList"></div>
        <div style="margin-top:12px; text-align:center;">
            <button class="btn secondary" id="saveSettingsBtn">💾 Запази настройките</button>
        </div>
    </div>

    <div class="panel" id="statsPanel">
        <h2>📊 Похарчени пари по месеци</h2>
        <div id="statsContent" class="loading-note">Зареждане на статистиката...</div>
    </div>

    <div id="recordModalOverlay" class="record-modal-overlay">
        <div class="record-modal">
            <div class="record-modal-header">
                <span id="recordModalTitle">Заявка</span>
                <button class="record-modal-close" id="recordModalCloseBtn">✕</button>
            </div>
            <div id="recordModalBody" class="record-modal-body"></div>
            <div style="padding:0 16px 10px; text-align:right;">
                <button class="btn small" id="addRecordItemBtn">➕ Добави артикул</button>
            </div>
            <div class="record-modal-footer">
                <div class="record-modal-total-row">
                    <div class="record-modal-total">Крайна сума: <input type="text" inputmode="decimal" id="recordModalTotal"></div>
                </div>
                <div id="recordModalStatus" class="status-msg"></div>
                <div class="record-modal-actions">
                    <button class="btn danger" id="recordModalDeleteBtn">🗑️ Изтрий заявката</button>
                    <button class="btn small" id="recordModalExportBtn">⬇️ Изтегли (Excel)</button>
                    <button class="btn secondary" id="recordModalSaveBtn">💾 Запази промените</button>
                </div>
            </div>
        </div>
    </div>

    <div id="productsWrap">
        <div class="empty-note">Избери период и натисни "Зареди резервации", за да видиш нужните продукти.</div>
    </div>

    <div class="save-bar" id="saveBar" style="display:none;">
        <button class="btn secondary" id="saveStockBtn">⬇️ Изтегли списъка (Excel)</button>
    </div>
    <div class="status-msg" id="saveStatus" style="text-align:center; margin-top:8px;"></div>
</div>

<script>

// Нови артикули - директно проследяване (1 бр/пакет на поръчка), извън рецептурния двигател
const DIRECT_TRACK_OPTIONS = {
    'Детско Шампанско': { key: 'new_shampansko', name: 'Детско Шампанско', unit: 'бутилка', qtyPerOrder: 1, supplier: 'НОВИ АРТИКУЛИ' },

function fmtDateBg(d) {
    return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
}

// Приема и запетая, и точка като десетичен разделител (напр. при Num Pad "." на бг клавиатура, което праща ",")
// Изчаква кратка пауза преди тежко обновяване на DOM — предпазва от "трепване"
// на виртуалната клавиатура на телефон/таблет при бързо писане в число
function debounce(fn, delay) {
    let timer;
    return function (...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), delay);
    };
}
function toNum(v) {
    if (v === null || v === undefined) return 0;
    const n = parseFloat(String(v).replace(/,/g, '.'));
    return isNaN(n) ? 0 : n;
}
// Празно поле вместо предварително вписана "0" - показва се само като сива подсказка (placeholder)
function numOrEmpty(v) {
    return (v === 0 || v === null || v === undefined || v === '') ? '' : v;
}
// Живо изчиства въведеното в текстово поле - позволява само цифри и един десетичен разделител, превръщайки запетая в точка
function attachDecimalSanitizer(input) {
    if (!input) return;
    input.addEventListener('input', () => {
        const before = input.value;
        let v = before.replace(/,/g, '.');
        const neg = v.trim().startsWith('-'); // позволяваме начален минус (за принудителна поръчка чрез отрицателна наличност)
        v = v.replace(/[^0-9.]/g, '');
        const firstDot = v.indexOf('.');
        if (firstDot !== -1) v = v.slice(0, firstDot + 1) + v.slice(firstDot + 1).replace(/\./g, '');
        v = (neg ? '-' : '') + v;
        if (v !== before) {
            const caretRaw = input.selectionStart;
            input.value = v;
            if (typeof caretRaw === 'number') {
                const diff = before.length - v.length;
                const newPos = Math.max(0, caretRaw - diff);
                try { input.setSelectionRange(newPos, newPos); } catch (e) { /* не се поддържа на този тип поле/браузър - без проблем */ }
            }
        }
    });
}
function parseReservationDate(dateStr) {
    if (!dateStr) return null;
    const parts = dateStr.split('/');
    if (parts.length !== 3) return null;
    const mo = parseInt(parts[0],10), da = parseInt(parts[1],10), yr = parseInt(parts[2],10);
    if (isNaN(mo)||isNaN(da)||isNaN(yr)) return null;
    return new Date(yr, mo-1, da);
}

            { key: 'packs', width: 14 },

            c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF512DA8' } };
        });

        let grandTotal = 0;
        const exportItems = []; // {name, supplier, cost} — за записа в статистиката по месеци
        SUPPLIER_ORDER.forEach(supplier => {
            const items = PRODUCTS.filter(p => p.supplier === supplier);
            if (!items.length) return;
            const lines = [];
            let supplierTotal = 0;
            items.forEach(p => {
                const need = computeNeed(p);
                const stock = stockData[p.key] || 0;
                const { order, packs } = computeOrder(p, need, stock);
                if (order <= 0.0001) return;
                const cost = lineCost(p, order, packs);
                supplierTotal += cost;
                const packLabel = p.packSize ? `${p.packSize} ${p.unit}` : '—';
                const packsLabel = packs !== null ? `${packs} бр.` : `${order.toFixed(2)} ${p.unit}`;
                const packPriceLabel = (p.price || 0).toFixed(2) + ' €' + (p.packSize ? '/опак.' : '/' + p.unit);
                const neededLabel = `${need.toFixed(2)} ${p.unit}`;
                lines.push([p.name, neededLabel, packLabel, packsLabel, packPriceLabel, cost.toFixed(2) + ' €']);
                exportItems.push({
                    name: p.name, supplier,
                    pack: packLabel, unitPrice: packPriceLabel,
                    neededQty: Math.round(need * 100) / 100,
                    neededUnit: p.unit,
                    qty: packs !== null ? packs : Math.round(order * 100) / 100,
                    qtyUnit: packs !== null ? 'бр.' : p.unit,
                    unitPriceValue: p.price || 0,
                    cost: Math.round(cost * 100) / 100
                });
            });
            if (!lines.length) return; // няма нищо за поръчване от този доставчик

            const catRow = sheet.addRow([supplier.toUpperCase(), '', '', '', '', '']);
            sheet.mergeCells(`A${catRow.number}:F${catRow.number}`);

            const subRow = sheet.addRow(['Общо ' + supplier, '', '', '', '', supplierTotal.toFixed(2) + ' €']);
            sheet.mergeCells(`A${subRow.number}:E${subRow.number}`);
            subRow.eachCell(c => {
                c.font = { bold: true, color: { argb: 'FFB71C1C' } };
                c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFCDD2' } };
            });

            sheet.addRow(['', '', '', '', '', '']);
            grandTotal += supplierTotal;
        });

        const totalRow = sheet.addRow(['КРАЙНА ОБЩА СУМА', '', '', '', '', grandTotal.toFixed(2) + ' €']);
        sheet.mergeCells(`A${totalRow.number}:E${totalRow.number}`);
        totalRow.eachCell(c => {

        });
        totalRow.height = 22;

        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `zayavka_${startVal}_${endVal}.xlsx`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        statusEl.textContent = '✅ Файлът е изтеглен.';
        statusEl.className = 'status-msg ok';

        // Записваме тази поръчка в статистиката за похарчени пари (по месеци)
        await logSpending(grandTotal, startVal, endVal, exportItems);
        loadSpendingStats();
    } catch (e) {

}

// ============================================================
// СТАТИСТИКА: похарчени пари по месеци (записва се при всяко изтегляне на списък)
// ============================================================
async function logSpending(total, periodStart, periodEnd, items) {
    try {
        const SpendLog = Parse.Object.extend('ZayavkiSpendingLog');
        const obj = new SpendLog();
        obj.set('total', total);
        obj.set('exportDate', new Date());
        obj.set('periodStart', periodStart);
        obj.set('periodEnd', periodEnd);
        obj.set('items', JSON.stringify(items || []));
        await obj.save();
    } catch (e) {
        console.error('Грешка при запис на статистика', e);
    }
}

function monthLabelBg(y, m) {
    const names = ['Януари','Февруари','Март','Април','Май','Юни','Юли','Август','Септември','Октомври','Ноември','Декември'];
    return `${names[m]} ${y}`;
}

const spendRecordsById = {}; // objectId -> Parse обект (кеш, за да отваряме модала без нова заявка)

async function loadSpendingStats() {
    const el = document.getElementById('statsContent');
    try {
        const SpendLog = Parse.Object.extend('ZayavkiSpendingLog');
        const query = new Parse.Query(SpendLog);
        query.limit(1000);
        query.descending('exportDate');
        const results = await query.find();

        if (!results.length) {
            el.innerHTML = '<div class="empty-note">Все още няма записани поръчки. Статистиката се попълва автоматично при всяко изтегляне на списъка.</div>';
            return;
        }

        for (const k in spendRecordsById) delete spendRecordsById[k];
        results.forEach(obj => { spendRecordsById[obj.id] = obj; });

        const byMonth = {}; // "YYYY-M" -> сума
        const recordsByMonth = {}; // "YYYY-M" -> [obj, ...]
        results.forEach(obj => {
            const d = obj.get('exportDate');
            const key = `${d.getFullYear()}-${d.getMonth()}`;
            byMonth[key] = (byMonth[key] || 0) + (obj.get('total') || 0);
            (recordsByMonth[key] = recordsByMonth[key] || []).push(obj);
        });

        const now = new Date();
        const currentKey = `${now.getFullYear()}-${now.getMonth()}`;
        const sortedKeys = Object.keys(byMonth).sort().reverse();
        let grandTotal = 0;

        let rows = sortedKeys.map(key => {
            const [y, m] = key.split('-').map(Number);
            const sum = byMonth[key];
            grandTotal += sum;
            const isCurrent = key === currentKey;
            let html = `<tr class="${isCurrent ? 'current-month' : ''}"><td>${monthLabelBg(y, m)}${isCurrent ? ' (текущ)' : ''}</td><td class="num">${sum.toFixed(2)} €</td></tr>`;
            if (isCurrent) {
                const recRows = recordsByMonth[key].map(obj => {
                    const ps = obj.get('periodStart') || '';
                    const pe = obj.get('periodEnd') || '';
                    const total = (obj.get('total') || 0).toFixed(2);
                    return `<div class="month-record-row" onclick="openRecordModal('${obj.id}')">
                        <span class="rec-period">📄 ${ps} → ${pe}</span>
                        <span class="rec-total">${total} €</span>
                    </div>`;
                }).join('');
                html += `<tr><td colspan="2"><div class="month-records">${recRows}</div></td></tr>`;
            }
            return html;
        }).join('');

        el.innerHTML = `
            <table class="stats-table">
                <tr><th>Месец</th><th style="text-align:right">Похарчено</th></tr>
                ${rows}
                <tr class="stats-total-row"><td>Общо (всички месеци)</td><td class="num">${grandTotal.toFixed(2)} €</td></tr>
            </table>
        `;
    } catch (e) {
        console.error('Грешка при зареждане на статистика', e);
        el.innerHTML = '<div class="empty-note">⚠️ Грешка при зареждане на статистиката (проблем с интернет връзката). <button class="btn small" onclick="loadSpendingStats()" style="margin-top:8px;">🔄 Опитай пак</button></div>';
    }
}

// МОДАЛ ЗА ОТВАРЯНЕ / РЕДАКТИРАНЕ НА ЗАПИСАНА ЗАЯВКА

function buildItemRowHtml(it) {
    it = it || {};
    const metaParts = [];
    if (it.supplier) metaParts.push(it.supplier);
    if (it.pack) metaParts.push('Опаковка: ' + it.pack);
    if (it.unitPrice) metaParts.push('Цена/опак.: ' + it.unitPrice);
    const meta = metaParts.join(' · ');
    const hasQty = it.qty !== undefined && it.qty !== null;
    return `
    <div class="record-item-row" data-unit-price="${it.unitPriceValue || ''}" data-supplier="${(it.supplier||'').replace(/"/g,'&quot;')}" data-pack="${(it.pack||'').replace(/"/g,'&quot;')}" data-unit-price-label="${(it.unitPrice||'').replace(/"/g,'&quot;')}" data-qty-unit="${(it.qtyUnit||'').replace(/"/g,'&quot;')}" data-needed-unit="${(it.neededUnit||'').replace(/"/g,'&quot;')}">
        <div class="rin-name-wrap">
            <input type="text" class="rin-name-input" placeholder="Име на артикул" value="${(it.name || '').replace(/"/g,'&quot;')}">
            ${meta ? `<div class="rin-meta">${meta}</div>` : ''}
        </div>
        <div class="rin-fields">
            <div class="rin-qty-wrap"><label>Нужно:</label><input type="text" inputmode="decimal" class="rin-need" value="${it.neededQty !== undefined && it.neededQty !== null ? it.neededQty : ''}" placeholder="—"><span class="rin-qty-unit">${it.neededUnit || ''}</span></div>
            <div class="rin-qty-wrap"><label>Кол-во:</label><input type="text" inputmode="decimal" class="rin-qty" value="${hasQty ? it.qty : ''}" placeholder="—"><span class="rin-qty-unit">${it.qtyUnit || ''}</span></div>
            <div class="rin-cost-wrap"><label>Цена:</label><input type="text" inputmode="decimal" class="rin-cost" value="${(it.cost || 0).toFixed(2)}"></div>
            <button type="button" class="rin-remove" title="Премахни артикула">✕</button>
        </div>
    </div>`;
}

function attachRowListeners(row) {
    const costInp = row.querySelector('.rin-cost');
    const qtyInp = row.querySelector('.rin-qty');
    const needInp = row.querySelector('.rin-need');
    const nameInp = row.querySelector('.rin-name-input');
    attachDecimalSanitizer(costInp);
    attachDecimalSanitizer(qtyInp);
    attachDecimalSanitizer(needInp);
    costInp.addEventListener('input', updateRecordModalTotal);
    qtyInp.addEventListener('input', () => {
        const unitPrice = toNum(row.dataset.unitPrice);
        if (unitPrice) {
            const qty = toNum(qtyInp.value) || 0;
            costInp.value = (qty * unitPrice).toFixed(2);
        }
        updateRecordModalTotal();
    });
    row.querySelector('.rin-remove').addEventListener('click', () => {
        row.remove();
        updateRecordModalTotal();
    });

    // Автодовършване по съществуващи артикули от базата продукти
    nameInp.addEventListener('input', () => showRinAutocomplete(row, nameInp));
    nameInp.addEventListener('blur', () => setTimeout(() => hideRinAutocomplete(row), 150));
    nameInp.addEventListener('focus', () => { if (nameInp.value.trim()) showRinAutocomplete(row, nameInp); });
}

function showRinAutocomplete(row, nameInp) {
    hideRinAutocomplete(row);
    const q = nameInp.value.trim().toLowerCase();
    if (!q) return;
    const matches = PRODUCTS.filter(p => p.name.toLowerCase().includes(q)).slice(0, 8);
    if (!matches.length) return;
    const wrap = row.querySelector('.rin-name-wrap');
    const dd = document.createElement('div');
    dd.className = 'rin-autocomplete';
    dd.innerHTML = matches.map((p, i) => `
        <div class="rin-autocomplete-item" data-i="${i}">
            <span class="aci-name">${p.name.replace(/</g,'&lt;')}</span>
            <span class="aci-meta">${(p.price||0).toFixed(2)} €${p.packSize ? ' / ' + p.packSize + ' ' + p.unit : '/' + p.unit}</span>
        </div>
    `).join('');
    dd.querySelectorAll('.rin-autocomplete-item').forEach((el, i) => {
        el.addEventListener('mousedown', (e) => {
            e.preventDefault();
            applyProductToRow(row, matches[i]);
            hideRinAutocomplete(row);
        });
    });
    wrap.appendChild(dd);
}

function hideRinAutocomplete(row) {
    const dd = row.querySelector('.rin-autocomplete');
    if (dd) dd.remove();
}

function applyProductToRow(row, p) {
    const nameInp = row.querySelector('.rin-name-input');
    const qtyInp = row.querySelector('.rin-qty');
    const costInp = row.querySelector('.rin-cost');
    const qtyUnitEl = row.querySelector('.rin-qty-unit');

    nameInp.value = p.name;
    row.dataset.unitPrice = p.price || 0;
    row.dataset.unitPriceLabel = (p.price || 0).toFixed(2) + ' €' + (p.packSize ? '/опак.' : '/' + p.unit);
    row.dataset.pack = p.packSize ? `${p.packSize} ${p.unit}` : '';
    row.dataset.supplier = p.supplier || '';
    row.dataset.qtyUnit = p.packSize ? 'бр.' : p.unit;
    if (qtyUnitEl) qtyUnitEl.textContent = row.dataset.qtyUnit;

    let metaEl = row.querySelector('.rin-meta');
    const metaParts = [];
    if (p.supplier) metaParts.push(p.supplier);
    if (row.dataset.pack) metaParts.push('Опаковка: ' + row.dataset.pack);
    metaParts.push('Цена/опак.: ' + row.dataset.unitPriceLabel);
    const metaHtml = metaParts.join(' · ');
    if (!metaEl) {
        metaEl = document.createElement('div');
        metaEl.className = 'rin-meta';
        row.querySelector('.rin-name-wrap').appendChild(metaEl);
    }
    metaEl.textContent = metaHtml;

    const qty = toNum(qtyInp.value) || 1;
    qtyInp.value = qty;
    costInp.value = (qty * (p.price || 0)).toFixed(2);
    updateRecordModalTotal();
}

function openRecordModal(id) {
    const obj = spendRecordsById[id];
    if (!obj) return;
    let items = [];
    try { items = JSON.parse(obj.get('items') || '[]'); } catch (e) { items = []; }

    document.getElementById('recordModalOverlay').dataset.recordId = id;
    document.getElementById('recordModalTitle').textContent =
        `Заявка: ${obj.get('periodStart') || ''} → ${obj.get('periodEnd') || ''}`;
    document.getElementById('recordModalStatus').textContent = '';
    document.getElementById('recordModalStatus').className = 'status-msg';

    const bodyEl = document.getElementById('recordModalBody');
    if (!items.length) {
        bodyEl.innerHTML = '<div class="empty-note" id="noItemsNote">Няма запазени артикули за тази заявка. Добави ги ръчно с бутона по-долу.</div>';
    } else {
        const groups = {};
        const groupOrder = [];
        items.forEach(it => {
            const g = it.supplier || 'Без група';
            if (!groups[g]) { groups[g] = []; groupOrder.push(g); }
            groups[g].push(it);
        });
        groupOrder.sort((a, b) => {
            const ia = SUPPLIER_ORDER.indexOf(a), ib = SUPPLIER_ORDER.indexOf(b);
            if (a === 'Без група') return 1;
            if (b === 'Без група') return -1;
            if (ia === -1 && ib === -1) return a.localeCompare(b);
            if (ia === -1) return 1;
            if (ib === -1) return -1;
            return ia - ib;
        });
        bodyEl.innerHTML = groupOrder.map(g => `
            <div class="rin-group" data-group-name="${g.replace(/"/g,'&quot;')}">
                <div class="rin-group-header">${g}</div>
                ${groups[g].map(it => buildItemRowHtml(it)).join('')}
            </div>
        `).join('');
    }
    bodyEl.querySelectorAll('.record-item-row').forEach(attachRowListeners);

    attachDecimalSanitizer(document.getElementById('recordModalTotal'));
    updateRecordModalTotal();
    document.getElementById('recordModalOverlay').classList.add('open');
}

function addRecordItemRow() {
    const bodyEl = document.getElementById('recordModalBody');
    const noItemsNote = document.getElementById('noItemsNote');
    if (noItemsNote) noItemsNote.remove();
    let group = bodyEl.querySelector('.rin-group[data-group-name="Без група"]');
    if (!group) {
        group = document.createElement('div');
        group.className = 'rin-group';
        group.dataset.groupName = 'Без група';
        group.innerHTML = '<div class="rin-group-header">Без група</div>';
        bodyEl.appendChild(group);
    }
    const wrap = document.createElement('div');
    wrap.innerHTML = buildItemRowHtml({ cost: 0 });
    const row = wrap.firstElementChild;
    group.appendChild(row);
    attachRowListeners(row);
    row.querySelector('.rin-name-input').focus();
    updateRecordModalTotal();
}

function updateRecordModalTotal() {
    const inputs = document.querySelectorAll('#recordModalBody input.rin-cost');
    let sum = 0;
    inputs.forEach(inp => { sum += toNum(inp.value) || 0; });
    document.getElementById('recordModalTotal').value = sum.toFixed(2);
}


function closeRecordModal() {
    document.getElementById('recordModalOverlay').classList.remove('open');
}

async function saveEditedRecord() {
    const overlay = document.getElementById('recordModalOverlay');
    const id = overlay.dataset.recordId;
    const obj = spendRecordsById[id];
    const statusEl = document.getElementById('recordModalStatus');
    if (!obj) return;

    const rows = document.querySelectorAll('#recordModalBody .record-item-row');
    const items = [];
    rows.forEach(row => {
        const name = row.querySelector('.rin-name-input').value.trim();
        const cost = toNum(row.querySelector('.rin-cost').value) || 0;
        const qtyVal = row.querySelector('.rin-qty').value;
        const needVal = row.querySelector('.rin-need').value;
        const item = {
            name,
            cost: Math.round(cost * 100) / 100,
            supplier: row.dataset.supplier || undefined,
            pack: row.dataset.pack || undefined,
            unitPrice: row.dataset.unitPriceLabel || undefined,
            unitPriceValue: row.dataset.unitPrice ? toNum(row.dataset.unitPrice) : undefined,
            qtyUnit: row.dataset.qtyUnit || undefined,
            neededUnit: row.dataset.neededUnit || undefined
        };
        if (qtyVal !== '') item.qty = toNum(qtyVal) || 0;
        if (needVal !== '') item.neededQty = toNum(needVal) || 0;
        if (!name && cost === 0 && qtyVal === '' && needVal === '') return; // прескача изцяло празен нов ред
        items.push(item);
    });
    // Крайната сума се взима директно от полето "Крайна сума" — може да е ръчно коригирана от потребителя
    const newTotal = Math.round((toNum(document.getElementById('recordModalTotal').value) || 0) * 100) / 100;

    statusEl.textContent = 'Запазване...';
    statusEl.className = 'status-msg';
    try {
        obj.set('items', JSON.stringify(items));
        obj.set('total', newTotal);
        await obj.save();
        statusEl.textContent = '✅ Запазено.';
        statusEl.className = 'status-msg ok';
        await loadSpendingStats(); // презарежда таблицата и месечните суми в реално време
        setTimeout(closeRecordModal, 500);
    } catch (e) {
        console.error(e);
        statusEl.textContent = '❌ Грешка при запазване.';
        statusEl.className = 'status-msg error';
    }
}

async function deleteRecord() {
    const overlay = document.getElementById('recordModalOverlay');
    const id = overlay.dataset.recordId;
    const obj = spendRecordsById[id];
    const statusEl = document.getElementById('recordModalStatus');
    if (!obj) return;

    if (!confirm('Сигурен ли си, че искаш да изтриеш тази заявка? Действието е необратимо.')) return;

    statusEl.textContent = 'Изтриване...';
    statusEl.className = 'status-msg';
    try {
        await obj.destroy();
        delete spendRecordsById[id];
        closeRecordModal();
        await loadSpendingStats(); // презарежда таблицата и месечните суми в реално време
    } catch (e) {
        console.error(e);
        statusEl.textContent = '❌ Грешка при изтриване.';
        statusEl.className = 'status-msg error';
    }
}

// ЗАРЕЖДАНЕ НА РЕЗЕРВАЦИИ ЗА ИЗБРАНИЯ ПЕРИОД
// ============================================================
async function loadReservationsForRange() {
    const startVal = document.getElementById('rangeStart').value;
    const endVal = document.getElementById('rangeEnd').value;
    const statusEl = document.getElementById('loadStatus');
    const loadBtn = document.getElementById('loadBtn');

    if (!startVal || !endVal) {
        statusEl.textContent = 'Моля, избери начална и крайна дата.';
        statusEl.className = 'status-msg error';
        return;
    }
    const startDate = new Date(startVal + 'T00:00:00');
    const endDate = new Date(endVal + 'T23:59:59');
    if (startDate > endDate) {
        statusEl.textContent = 'Началната дата трябва да е преди крайната.';
        statusEl.className = 'status-msg error';
        return;
    }

    loadBtn.disabled = true;
    statusEl.textContent = 'Зареждане...';
    statusEl.className = 'status-msg';
    document.getElementById('productsWrap').innerHTML = '<div class="loading-note">Зареждане на резервации...</div>';

    try {
        const snap = await reservationsDb.collection('reservations').get();
        resetStockForNewPeriod(); // наличностите се нулират при всяко ново зареждане на период

        const matched = [];
        snap.forEach(doc => {
            const data = doc.data();
            const resDate = parseReservationDate(data.date);
            if (!resDate) return;
            if (resDate >= startDate && resDate <= endDate) {
                matched.push({ date: resDate, dateStr: data.date, name: data.name || '(без име)', party: data.party || '',
                    kidsMenu: data.kidsMenu || '', kidsCount: parseFloat(data.kidsCount) || 0,
                    kidsCatering: Array.isArray(data.kidsCatering) ? data.kidsCatering : [],
                    parentsCatering: Array.isArray(data.parentsCatering) ? data.parentsCatering : [] });
            }
        });
        matched.sort((a,b) => a.date - b.date);
        reservationsMatched = matched;

        // Изчисляваме counts по менюта
        const counts = {}; // rowNum -> count
        const directCounts = {}; // optionKey -> count
        let extraPrzeni = 0, extraPikantni = 0;

        matched.forEach(r => {
            if (r.kidsMenu && KIDS_MENU_TO_ROW[r.kidsMenu] !== undefined) {
                const row = KIDS_MENU_TO_ROW[r.kidsMenu];
                counts[row] = (counts[row] || 0) + (r.kidsCount || 1);
            }
            const allCatering = [...r.kidsCatering, ...r.parentsCatering];
            allCatering.forEach(item => {
                const opt = item.option;
                const cnt = parseFloat(item.count) || 0;
                if (!opt || !cnt) return;
                if (CATERING_TO_ROW[opt] !== undefined) {
                    const row = CATERING_TO_ROW[opt];
                    counts[row] = (counts[row] || 0) + cnt;
                } else if (DIRECT_TRACK_OPTIONS[opt]) {
                    const dk = DIRECT_TRACK_OPTIONS[opt].key;
                    directCounts[dk] = (directCounts[dk] || 0) + cnt * DIRECT_TRACK_OPTIONS[opt].qtyPerOrder;
                } else if (opt === 'Пържени Картофи') {
                    extraPrzeni += cnt * POTATO_EXTRA_OPTIONS['Пържени Картофи'].qtyPerOrder;
                } else if (opt === 'Пикантни Картофи') {
                    extraPikantni += cnt * POTATO_EXTRA_OPTIONS['Пикантни Картофи'].qtyPerOrder;
                }
            });
        });

        currentCounts = new Proxy(counts, { get: (t, prop) => (t[prop] !== undefined ? t[prop] : 0) });
        currentDirectCounts = directCounts;
        currentExtra = { przeni: extraPrzeni, pikantni: extraPikantni };

        statusEl.textContent = `✅ Заредени ${matched.length} резервации за периода ${fmtDateBg(startDate)} – ${fmtDateBg(endDate)}.`;
        statusEl.className = 'status-msg ok';

        renderSummary(counts, directCounts, matched);
        renderProducts();
        document.getElementById('saveBar').style.display = 'flex';
    } catch (e) {
        console.error(e);
        statusEl.textContent = '❌ Грешка при зареждане от базата с резервации.';
        statusEl.className = 'status-msg error';
        document.getElementById('productsWrap').innerHTML = '<div class="empty-note">Възникна грешка. Опитай отново.</div>';
    }
    loadBtn.disabled = false;
}

// Обратна карта: rowNum -> четимо име (за чиповете)
const ROW_NAMES = {};
Object.entries(KIDS_MENU_TO_ROW).forEach(([name,row]) => { ROW_NAMES[row] = name; });
Object.entries(CATERING_TO_ROW).forEach(([name,row]) => { ROW_NAMES[row] = name; });

function renderSummary(counts, directCounts, matched) {
    const chipsEl = document.getElementById('summaryChips');
    const listEl = document.getElementById('resvList');
    let chipsHtml = '';
    Object.entries(counts).forEach(([row, cnt]) => {
        if (cnt > 0) chipsHtml += `<div class="chip">${ROW_NAMES[row] || ('ред '+row)}: ${cnt}</div>`;
    });
    Object.entries(directCounts).forEach(([key, cnt]) => {
        if (cnt > 0) {
            const item = Object.values(DIRECT_TRACK_OPTIONS).find(i => i.key === key);
            chipsHtml += `<div class="chip">${item ? item.name : key}: ${cnt}</div>`;
        }
    });
    if (currentExtra.przeni > 0) chipsHtml += `<div class="chip">Пържени Картофи (доп.): ${(currentExtra.przeni/0.25).toFixed(0)}</div>`;
    if (currentExtra.pikantni > 0) chipsHtml += `<div class="chip">Пикантни Картофи (доп.): ${(currentExtra.pikantni/0.25).toFixed(0)}</div>`;
    chipsEl.innerHTML = chipsHtml || '<div class="chip empty">Няма поръчани менюта в периода</div>';

    listEl.innerHTML = matched.length ? matched.map(r =>
        `<div>${fmtDateBg(r.date)} — ${r.name}${r.party ? ' (' + r.party + ')' : ''}${r.kidsMenu ? ' · меню: ' + r.kidsMenu : ''}${r.kidsCount ? ' · ' + r.kidsCount + ' деца' : ''}</div>`
    ).join('') : '';
}

// ============================================================
// ИЗЧИСЛЯВАНЕ И ИЗОБРАЖЕНИЕ НА ПРОДУКТИТЕ
// ============================================================
function computeNeed(product) {
    if (product.manualNeed) {
        return manualNeedData[product.key] || 0;
    }
    let need = product.need(currentCounts);
    if (product.direct) {
        need = currentDirectCounts[product.key] || 0;
    }
    if (product.extraKey === 'przeni') need += currentExtra.przeni;
    if (product.extraKey === 'pikantni') need += currentExtra.pikantni;
    return need;
}

function computeOrder(p, need, stock) {
    const raw = Math.max(0, need - stock);
    if (raw <= 0.0001) return { order: 0, packs: 0 };
    if (p.packSize) {
        const packs = Math.ceil((raw - 1e-9) / p.packSize);
        return { order: packs * p.packSize, packs };
    }
    return { order: raw, packs: null };
}

function lineCost(p, order, packs) {
    if (order <= 0.0001) return 0;
    if (p.packSize && packs !== null) return packs * (p.price || 0);
    return order * (p.price || 0);
}

function orderCellHtml(p, need, stock) {
    const { order, packs } = computeOrder(p, need, stock);
    const cls = order > 0.0001 ? 'pos' : 'zero';
    const packNote = packs ? ` <span style="color:#999;font-weight:normal;">(${packs} оп.)</span>` : '';
    return `<span class="order-cell ${cls}">${order.toFixed(2)} ${p.unit}${packNote}</span>`;
}

function priceCellHtml(p, order, packs) {
    const cost = lineCost(p, order, packs);
    return `<span class="price-col">${cost.toFixed(2)} €</span>`;
}

function renderProducts() {
    const wrap = document.getElementById('productsWrap');
    let html = '';
    let grandTotal = 0;
    SUPPLIER_ORDER.forEach(supplier => {
        const items = PRODUCTS.filter(p => p.supplier === supplier);
        if (!items.length) return;
        let rows = '';
        let supplierTotal = 0;
        items.forEach(p => {
            const need = computeNeed(p);
            const stock = stockData[p.key] || 0;
            const { order, packs } = computeOrder(p, need, stock);
            supplierTotal += lineCost(p, order, packs);
            const needCell = p.manualNeed
                ? `<input type="text" inputmode="decimal" class="need-input" data-key="${p.key}" value="${numOrEmpty(need)}" placeholder="0" style="width:62px; padding:5px 6px; border:1.5px solid #ddd; border-radius:6px; font-size:12px; text-align:right; font-family:inherit;">`
                : `${need.toFixed(2)} ${p.unit}`;
            rows += `<tr data-prod-key="${p.key}">
                <td>${p.name}</td>
                <td class="num need need-cell-wrap">${needCell}</td>
                <td class="num">
                    <input type="text" inputmode="decimal" class="stock-input" data-key="${p.key}" value="${numOrEmpty(stock)}" placeholder="0">
                    <button type="button" class="sign-toggle-btn" data-key="${p.key}" title="Обърни знака (отрицателна наличност = принудителна поръчка отгоре)">±</button>
                </td>
                <td class="num order-cell-wrap">${orderCellHtml(p, need, stock)}</td>
                <td class="num price-cell-wrap">${priceCellHtml(p, order, packs)}</td>
            </tr>`;
        });
        grandTotal += supplierTotal;
        html += `<div class="supplier-group">
            <div class="supplier-title">${supplier}</div>
            <table class="prod-table">
                <tr><th>Продукт</th><th style="text-align:right">Нужно</th><th style="text-align:right">Налично</th><th style="text-align:right">Поръчване</th><th style="text-align:right">Цена</th></tr>
                ${rows}
            </table>
            <div class="supplier-subtotal"><span>Общо ${supplier}</span><span data-supplier-total="${supplier}">${supplierTotal.toFixed(2)} €</span></div>
        </div>`;
    });
    html += `<div class="grand-total"><span>Крайна обща сума</span><span id="grandTotalValue">${grandTotal.toFixed(2)} €</span></div>`;
    wrap.innerHTML = html || '<div class="empty-note">Няма продукти за показване.</div>';

    // Реално-времево обновяване на "Поръчване", "Цена" и сумите при промяна на "Налично"
    wrap.querySelectorAll('input.stock-input').forEach(input => {
        attachDecimalSanitizer(input);
        const recalcRow = debounce(() => {
            const key = input.dataset.key;
            const p = PRODUCTS.find(pr => pr.key === key);
            if (!p) return;
            const stock = toNum(input.value);
            stockData[key] = stock;
            const need = computeNeed(p);
            const { order, packs } = computeOrder(p, need, stock);
            const row = input.closest('tr');
            row.querySelector('.order-cell-wrap').innerHTML = orderCellHtml(p, need, stock);
            row.querySelector('.price-cell-wrap').innerHTML = priceCellHtml(p, order, packs);
            recalcTotals();
        }, 250);
        input.addEventListener('input', recalcRow);
    });

    // Бутонче ± до "Налично" - обръща знака (полезно на телефон, където няма клавиш минус)
    wrap.querySelectorAll('.sign-toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const key = btn.dataset.key;
            const input = wrap.querySelector(`input.stock-input[data-key="${key}"]`);
            if (!input) return;
            const negated = -toNum(input.value);
            input.value = numOrEmpty(negated);
            input.dispatchEvent(new Event('input'));
        });
    });

    // Реално-времево обновяване при ръчно въведено "Нужно" (за артикули без рецепта)
    wrap.querySelectorAll('input.need-input').forEach(input => {
        attachDecimalSanitizer(input);
        const recalcRow = debounce(() => {
            const key = input.dataset.key;
            const p = PRODUCTS.find(pr => pr.key === key);
            if (!p) return;
            manualNeedData[key] = toNum(input.value);
            const need = computeNeed(p);
            const stock = stockData[key] || 0;
            const { order, packs } = computeOrder(p, need, stock);
            const row = input.closest('tr');
            row.querySelector('.order-cell-wrap').innerHTML = orderCellHtml(p, need, stock);
            row.querySelector('.price-cell-wrap').innerHTML = priceCellHtml(p, order, packs);
            recalcTotals();
        }, 250);
        input.addEventListener('input', recalcRow);
    });
}

function recalcTotals() {
    let grandTotal = 0;
    SUPPLIER_ORDER.forEach(supplier => {
        const items = PRODUCTS.filter(p => p.supplier === supplier);
        if (!items.length) return;
        let supplierTotal = 0;
        items.forEach(p => {
            const need = computeNeed(p);
            const stock = stockData[p.key] || 0;
            const { order, packs } = computeOrder(p, need, stock);
            supplierTotal += lineCost(p, order, packs);
        });
        const el = document.querySelector(`[data-supplier-total="${supplier}"]`);
        if (el) el.textContent = supplierTotal.toFixed(2) + ' €';
        grandTotal += supplierTotal;
    });
    const gEl = document.getElementById('grandTotalValue');
    if (gEl) gEl.textContent = grandTotal.toFixed(2) + ' €';
}

// ============================================================
// НАСТРОЙКИ: опаковка и цена на артикул (трайно записани в базата)
// ============================================================
const UNIT_OPTIONS = ['бр','кг','г','л','мл'];

async function loadCustomItems() {
    try {
        const CustomItem = Parse.Object.extend('ZayavkiCustomItems');
        const query = new Parse.Query(CustomItem);
        query.limit(1000);
        const results = await query.find();
        results.forEach(obj => {
            const key = obj.get('key');
            if (PRODUCTS.some(p => p.key === key)) return; // вече е добавен
            const supplier = obj.get('supplier') || 'НОВИ АРТИКУЛИ';
            if (!SUPPLIER_ORDER.includes(supplier)) SUPPLIER_ORDER.push(supplier);
            PRODUCTS.push({
                key,
                name: obj.get('name') || 'Артикул',
                unit: obj.get('unit') || 'бр',
                supplier,
                need: () => 0,
                manualNeed: true,
                packSize: obj.get('packSize') || null,
                price: obj.get('price') || 0
            });
        });
    } catch (e) {
        console.error('Грешка при зареждане на нови артикули', e);
    }
}

async function addNewArticle() {
    const statusEl = document.getElementById('settingsStatus');
    const name = document.getElementById('newArtName').value.trim();
    const unit = document.getElementById('newArtUnit').value;
    const catSelect = document.getElementById('newArtCategory').value;
    const catNew = document.getElementById('newArtCategoryNew').value.trim();
    const packVal = toNum(document.getElementById('newArtPack').value);
    const priceVal = toNum(document.getElementById('newArtPrice').value);

    if (!name) { statusEl.textContent = 'Моля, въведи име на артикула.'; statusEl.className = 'status-msg error'; return; }
    const supplier = (catSelect === '__new__') ? catNew : catSelect;
    if (!supplier) { statusEl.textContent = 'Моля, избери или въведи категория.'; statusEl.className = 'status-msg error'; return; }

    const packSize = (!isNaN(packVal) && packVal > 0) ? packVal : null;
    const key = 'custom_' + name.toLowerCase().replace(/[^a-zа-я0-9]+/gi, '_') + '_' + Date.now();

    if (!SUPPLIER_ORDER.includes(supplier)) SUPPLIER_ORDER.push(supplier);
    PRODUCTS.push({ key, name, unit, supplier, need: () => 0, manualNeed: true, packSize, price: priceVal });

    try {
        const CustomItem = Parse.Object.extend('ZayavkiCustomItems');
        const obj = new CustomItem();
        obj.set('key', key); obj.set('name', name); obj.set('unit', unit);
        obj.set('supplier', supplier); obj.set('packSize', packSize || 0); obj.set('price', priceVal);
        await obj.save();
        statusEl.textContent = `✅ Артикул "${name}" е добавен в категория "${supplier}".`;
        statusEl.className = 'status-msg ok';
    } catch (e) {
        console.error(e);
        statusEl.textContent = '❌ Грешка при запазване на новия артикул.';
        statusEl.className = 'status-msg error';
    }

    document.getElementById('newArtName').value = '';
    document.getElementById('newArtPack').value = '';
    document.getElementById('newArtPrice').value = '';
    document.getElementById('newArtCategoryNew').value = '';
    document.getElementById('newArtCategoryNewWrap').style.display = 'none';
    renderSettingsPanel(supplier); // остава на последно избраната категория, за да можеш да добавиш следващ артикул в нея
    if (reservationsMatched.length || document.getElementById('productsWrap').querySelector('.supplier-group')) renderProducts();
}

async function loadProductSettings() {
    try {
        const Setting = Parse.Object.extend('ZayavkiSettings');
        const query = new Parse.Query(Setting);
        query.limit(1000);
        const results = await query.find();
        results.forEach(obj => {
            const key = obj.get('key');
            const packSize = obj.get('packSize');
            const price = obj.get('price');
            const unit = obj.get('unit');
            const supplier = obj.get('supplier');
            const name = obj.get('name');
            const p = PRODUCTS.find(pr => pr.key === key);
            if (p) {
                if (packSize !== undefined && packSize !== null) p.packSize = packSize > 0 ? packSize : null;
                if (price !== undefined && price !== null) p.price = price;
                if (unit) p.unit = unit;
                if (name) p.name = name;
                if (supplier) {
                    p.supplier = supplier;
                    if (!SUPPLIER_ORDER.includes(supplier)) SUPPLIER_ORDER.push(supplier);
                }
            }
        });
    } catch (e) {
        console.error('Грешка при зареждане на настройки', e);
    }
}

function renderSettingsPanel(preserveCategory) {
    const listEl = document.getElementById('settingsList');
    const catSelectEl = document.getElementById('newArtCategory');
    const prevValue = preserveCategory || catSelectEl.value;
    const currentCatOptions = SUPPLIER_ORDER.map(s => `<option value="${s}">${s}</option>`).join('');
    catSelectEl.innerHTML = currentCatOptions + `<option value="__new__">+ Нова категория...</option>`;
    if (prevValue && SUPPLIER_ORDER.includes(prevValue)) {
        catSelectEl.value = prevValue;
    }

    let html = '';
    SUPPLIER_ORDER.forEach(supplier => {
        const items = PRODUCTS.filter(p => p.supplier === supplier);
        if (!items.length) return;
        html += `<div class="settings-supplier-title">${supplier}</div>`;
        html += `<div class="settings-hdr"><span>Артикул</span><span>Категория</span><span>Мярка</span><span>Опаковка</span><span>Цена/опак.</span></div>`;
        items.forEach(p => {
            const unitOpts = UNIT_OPTIONS.map(u => `<option value="${u}" ${u === p.unit ? 'selected' : ''}>${u}</option>`).join('');
            const catOpts = SUPPLIER_ORDER.map(s => `<option value="${s}" ${s === p.supplier ? 'selected' : ''}>${s}</option>`).join('');
            html += `<div class="settings-row" data-settings-key="${p.key}">
                <input type="text" class="settings-name" value="${p.name.replace(/"/g,'&quot;')}" style="text-align:left;">
                <select class="settings-category">${catOpts}</select>
                <select class="settings-unit">${unitOpts}</select>
                <input type="text" inputmode="decimal" class="settings-pack" value="${p.packSize || ''}" placeholder="без">
                <input type="text" inputmode="decimal" class="settings-price" value="${numOrEmpty(p.price)}" placeholder="0">
            </div>`;
        });
    });
    listEl.innerHTML = html;
    listEl.querySelectorAll('input.settings-pack, input.settings-price').forEach(attachDecimalSanitizer);
}

async function saveProductSettings() {
    const btn = document.getElementById('saveSettingsBtn');
    const statusEl = document.getElementById('settingsStatus');
    btn.disabled = true;
    statusEl.textContent = 'Запазване...';
    statusEl.className = 'status-msg';
    try {
        const Setting = Parse.Object.extend('ZayavkiSettings');
        const existingQuery = new Parse.Query(Setting);
        existingQuery.limit(1000);
        const existing = await existingQuery.find();
        const existingMap = {};
        existing.forEach(obj => { existingMap[obj.get('key')] = obj; });

        const rowsEls = document.querySelectorAll('.settings-row');
        const toSave = [];
        let lastCategory = null;
        rowsEls.forEach(rowEl => {
            const key = rowEl.dataset.settingsKey;
            const nameVal = rowEl.querySelector('.settings-name').value.trim();
            const packVal = toNum(rowEl.querySelector('.settings-pack').value);
            const priceVal = toNum(rowEl.querySelector('.settings-price').value);
            const unitVal = rowEl.querySelector('.settings-unit').value;
            const catVal = rowEl.querySelector('.settings-category').value;
            const packSize = (!isNaN(packVal) && packVal > 0) ? packVal : null;
            const p = PRODUCTS.find(pr => pr.key === key);
            if (p) { p.packSize = packSize; p.price = priceVal; p.unit = unitVal; p.supplier = catVal; if (nameVal) p.name = nameVal; }
            if (!SUPPLIER_ORDER.includes(catVal)) SUPPLIER_ORDER.push(catVal);
            lastCategory = catVal;

            let obj = existingMap[key];
            if (!obj) { obj = new Setting(); obj.set('key', key); }
            obj.set('packSize', packSize || 0);
            obj.set('price', priceVal);
            obj.set('unit', unitVal);
            obj.set('supplier', catVal);
            if (nameVal) obj.set('name', nameVal);
            toSave.push(obj.save());
        });
        await Promise.all(toSave);
        statusEl.textContent = '✅ Настройките са запазени.';
        statusEl.className = 'status-msg ok';
        renderSettingsPanel();
        renderProducts(); // презареждаме таблицата с новите цени/опаковки/категории
    } catch (e) {
        console.error(e);
        statusEl.textContent = '❌ Грешка при запазване на настройките.';
        statusEl.className = 'status-msg error';
    }
    btn.disabled = false;
}

// ИНИЦИАЛИЗАЦИЯ
// ============================================================
(async function init() {
    const today = new Date();
    const in7 = new Date(today); in7.setDate(in7.getDate() + 6);
    const toISO = d => d.toISOString().split('T')[0];
    document.getElementById('rangeStart').value = toISO(today);
    document.getElementById('rangeEnd').value = toISO(in7);
    document.getElementById('loadBtn').addEventListener('click', loadReservationsForRange);
    document.getElementById('saveStockBtn').addEventListener('click', exportListToXlsx);
    document.getElementById('saveSettingsBtn').addEventListener('click', saveProductSettings);
    document.getElementById('addArticleBtn').addEventListener('click', addNewArticle);
    attachDecimalSanitizer(document.getElementById('newArtPack'));
    attachDecimalSanitizer(document.getElementById('newArtPrice'));
    document.getElementById('newArtCategory').addEventListener('change', (e) => {
        document.getElementById('newArtCategoryNewWrap').style.display = (e.target.value === '__new__') ? 'block' : 'none';
    });
    document.getElementById('toggleSettingsBtn').addEventListener('click', () => {
        const panel = document.getElementById('settingsPanel');
        panel.classList.toggle('open');
        if (panel.classList.contains('open')) renderSettingsPanel();
    });
    document.getElementById('recordModalCloseBtn').addEventListener('click', closeRecordModal);
    document.getElementById('recordModalSaveBtn').addEventListener('click', saveEditedRecord);
    document.getElementById('recordModalDeleteBtn').addEventListener('click', deleteRecord);
    document.getElementById('recordModalExportBtn').addEventListener('click', exportEditedRecordToXlsx);
    document.getElementById('addRecordItemBtn').addEventListener('click', addRecordItemRow);
    document.getElementById('recordModalOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'recordModalOverlay') closeRecordModal();
    });
    await loadCustomItems();      // зареждаме ръчно добавените артикули
    await loadProductSettings();  // зареждаме запазените опаковки/цени/мерки/категории
    renderSettingsPanel();
    loadSpendingStats();          // зареждаме статистиката за похарчени пари
})();
